name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - uses: taiki-e/install-action@just
      - run: just check-all

  publish:
    # Releases only happen when a v* tag is pushed. On branch pushes and
    # pull requests this job is skipped; only the test job runs there.
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish (JSR & npm)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: just release
