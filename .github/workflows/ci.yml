name: CI

on:
  push:
    branches: [main, feat/deno-bootstrap]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - run: deno ci
      - run: deno check
      - run: deno lint
      - run: deno fmt --check
      - run: deno test --allow-run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    # only on tags starting with v
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - run: deno ci
      - run: deno task compile
      - uses: actions/upload-artifact@v4
        with:
          name: vormen
          path: ./target/vormen
