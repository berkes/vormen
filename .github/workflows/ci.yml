name: CI

on:
  push:
    branches: [main, feat/deno-bootstrap]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - run: deno ci
      - run: deno check
      - run: deno lint
      - run: deno fmt --check
      - run: deno test --allow-run

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    # only on tags starting with v
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - run: deno ci
      - run: deno task compile
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ./target/vormen
