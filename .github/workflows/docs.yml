name: Docs

# Builds the Docusaurus site in site/ and deploys it to GitHub Pages.
# Pages must be configured with source "GitHub Actions" (Settings -> Pages).
#
# ```vorm blocks in site/docs are rendered to SVG at build time by the remark
# plugin (site/plugins/remark-vormen.ts), which shells out to deno — hence
# setup-deno below. Rendered SVGs are inlined as data URIs; nothing to commit.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "doc/**"
      - "src/**"
      - "deno.json"
      - "justfile"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "site/**"
      - "doc/**"
      - "src/**"
      - "deno.json"
      - "justfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Build site (renders all vorm blocks)
        run: npm run build --prefix site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
