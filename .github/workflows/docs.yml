name: Docs

# Builds the Docusaurus site in site/ and deploys it to GitHub Pages.
# Pages must be configured with source "GitHub Actions" (Settings -> Pages).
#
# The example SVGs (site/static/examples/) are regenerated as part of the build
# (npm run generate, also wired as prebuild of npm run build), so the deployed
# site never shows stale artwork. The "stale SVGs" step fails the run when the
# committed SVGs differ from freshly generated ones.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "doc/**"
      - "examples/**"
      - "src/**"
      - "deno.json"
      - "justfile"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "site/**"
      - "doc/**"
      - "examples/**"
      - "src/**"
      - "deno.json"
      - "justfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Regenerate example SVGs
        run: npm run generate --prefix site
      - name: Fail if committed example SVGs are stale
        run: git diff --exit-code -- site/static/examples
      - name: Build site
        run: npm run build --prefix site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
