[package]
name = "vormen"
version = "0.2.0"
edition = "2024"
description = "A set of tools and libraries for generative art in SVG"
license = "MIT"
repository = "https://github.com/berkes/vormen"
authors = ["Bèr Kessels <ber@berk.es>"]

[dependencies]
chrono = "0.4.45"
noise = "0.9.0"
rand = "0.8.5"
usvg-tree = "0.38.0"
tiny-skia-path = "0.11.4"
xmlwriter = "0.1"

[lib]
name = "vormen"
path = "src/lib.rs"

[dev-dependencies]
approx = "0.5.1"
